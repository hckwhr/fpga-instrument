   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #233c50" x="97.795276" y="26.352691" transform="rotate(-0 97.795276 26.352691)">01  音符与表情输入</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="97.795276" y="47.337143" transform="rotate(-0 97.795276 47.337143)">音高 / 力度 / ID / 音高调制</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #233c50" x="307.559055" y="26.352691" transform="rotate(-0 307.559055 26.352691)">02  独立状态 ×32</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="307.559055" y="47.337143" transform="rotate(-0 307.559055 47.337143)">每声部相位 / 频率 / 包络</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #233c50" x="307.559055" y="97.218833" transform="rotate(-0 307.559055 97.218833)">03  共享音高运算</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="307.559055" y="118.203285" transform="rotate(-0 307.559055 118.203285)">按 lane 轮询，结果归还所属声部</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #233c50" x="97.795276" y="97.218833" transform="rotate(-0 97.795276 97.218833)">04  波形与钢琴查表</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="97.795276" y="118.203285" transform="rotate(-0 97.795276 118.203285)">按相位取值，保持独立采样</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #233c50" x="97.795276" y="168.084975" transform="rotate(-0 97.795276 168.084975)">05  独立增益与包络</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="97.795276" y="189.069427" transform="rotate(-0 97.795276 189.069427)">按样本推进起音、维持和释放</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #233c50" x="307.559055" y="168.084975" transform="rotate(-0 307.559055 168.084975)">06  流水混合与饱和</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.2px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="307.559055" y="189.069427" transform="rotate(-0 307.559055 189.069427)">32 路归约为一个混音采样</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #526575" x="202.677165" y="228.699388" transform="rotate(-0 202.677165 228.699388)">共享的是计算单元，32 份声部状态始终独立保存。</text>
